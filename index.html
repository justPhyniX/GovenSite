<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Goven</title>
</head>
<body>
    <div id="main-content">
        <div id="top-bar">            
            <div id="goven-title">
                <img src="assets/icons/goven-icon.png" alt="G" id="goven-icon">
                <h4 style="color: white;">GOVEN.exe</h4>
            </div>
            
            <div id="top-buttons">
                <button type="button" class="button" id="minimize-button">
                <img src="assets/icons/minimize-window.png">
                </button>
                <button type="button" class="button" id="maximize-button">
                    <img src="assets/icons/maximise-tab.png">
                </button>
                <button type="button" class="button" id="close-tab">
                    <img src="assets/icons/close-tab.png" alt="">
                </button>
            </div>
        </div>

        <marquee id="top-ticker">
            Welcome to Goven <span class="diamond">◆</span>
            Blemi$ season <span class="diamond">◆</span>
            <span class="flashing">NEW!! NEW!! NEW!!</span> <span class="diamond">◆</span>
            Athens Greece - EST. 2019 <span class="diamond">◆</span>
            Y2K compliant
        </marquee>

        <div id="weather-widget">
            weather widget placeholder
        </div>

        <div class="banner">
            <img src="assets/banner.gif" alt="GOVEN">

            <div id="subtitle">
                <span style="color: rgb(255, 217, 0);"> CREATIVE COLLECTIVE - Athens</span>
                <br>
                <span style="color: cyan">Rap / Grime / EDM - Since '19</span>
            </div>

            <button id="join-button">
                JOIN NOW
            </button>
        </div>
    </div>
</body>
</html>
